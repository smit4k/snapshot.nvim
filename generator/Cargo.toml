[package]
name = "snapshot-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "snapshot-generator"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
shellexpand = "3.0"
chrono = "0.4"
